name: Publish Pre-Release

on:
  push:
    branches:
      - next

permissions:
  contents: write

concurrency:
  group: publish-pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build Debian Package (${{ matrix.package_name }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: oxfordia-pod
            package_script: build:deb
            arch: amd64
            runner: ubuntu-latest
          - package_name: oxfordia-pod
            package_script: build:deb
            arch: arm64
            runner: ubuntu-24.04-arm
          - package_name: oxfordia-pod-idp
            package_script: build:deb:idp
            arch: amd64
            runner: ubuntu-latest
          - package_name: oxfordia-pod-idp
            package_script: build:deb:idp
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="0.0.0-next.${short_sha}"
          tag_name="next-${short_sha}"

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server packages
        if: matrix.package_name == 'oxfordia-pod'
        run: npm run build:server:types

      - name: Build UI server bundle
        if: matrix.package_name == 'oxfordia-pod'
        run: npm run build:ui

      - name: Setup Ruby for fpm
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fpm
        run: gem install --no-document fpm

      - name: Build Debian package
        run: VERSION=${{ steps.meta.outputs.version }} ARCH=${{ matrix.arch }} npm run ${{ matrix.package_script }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}-deb-${{ matrix.arch }}
          path: build/${{ matrix.package_name }}_${{ steps.meta.outputs.version }}_${{ matrix.arch }}.deb

  publish-pre-release:
    name: Publish Pre-Release
    needs: build-deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive metadata
        id: meta
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="0.0.0-next.${short_sha}"
          tag_name="next-${short_sha}"

          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Flatten Debian artifacts
        run: |
          find build -mindepth 2 -type f -name '*.deb' -exec mv {} build/ \;

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/pod-server --set triplestore.external.url=https://sparql.example.org/query

      - name: Package Helm chart
        run: |
          helm package deploy/helm/pod-server \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination build/

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Pre-release ${{ steps.meta.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Automated pre-release build from `next`.

            Commit: `${{ github.sha }}`
            Version: `${{ steps.meta.outputs.version }}`
          files: |
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_arm64.deb
            build/oxfordia-pod-idp_${{ steps.meta.outputs.version }}_amd64.deb
            build/oxfordia-pod-idp_${{ steps.meta.outputs.version }}_arm64.deb
            oxfordia-pod-init.sh
            oxfordia-pod-idp-init.sh
            build/pod-server-${{ steps.meta.outputs.version }}.tgz
