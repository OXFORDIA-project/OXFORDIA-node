name: Release Deploy Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server packages
        run: npm run build:server:packages

      - name: Build UI server bundle
        run: npm run build:ui

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/pod-server:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/pod-server:latest

      - name: Setup Ruby for fpm
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fpm
        run: gem install --no-document fpm

      - name: Build Debian package
        run: VERSION=${{ steps.meta.outputs.version }} npm run build:deb

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            oxfordia-pod-init.sh

  helm-chart:
    runs-on: ubuntu-latest
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint deploy/helm/pod-server --set triplestore.external.url=https://sparql.example.org/query

      - name: Publish Helm chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
