name: Publish Release

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build Debian Package (${{ matrix.package_name }} / ${{ matrix.arch }})
    if: github.event.release.prerelease == false
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: oxfordia-pod
            package_script: build:deb
            arch: amd64
            runner: ubuntu-latest
          - package_name: oxfordia-pod
            package_script: build:deb
            arch: arm64
            runner: ubuntu-24.04-arm
          - package_name: oxfordia-pod-idp
            package_script: build:deb:idp
            arch: amd64
            runner: ubuntu-latest
          - package_name: oxfordia-pod-idp
            package_script: build:deb:idp
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Derive metadata
        id: meta
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server packages
        if: matrix.package_name == 'oxfordia-pod'
        run: npm run build:server:types

      - name: Build UI server bundle
        if: matrix.package_name == 'oxfordia-pod'
        run: npm run build:ui

      - name: Setup Ruby for fpm
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fpm
        run: gem install --no-document fpm

      - name: Build Debian package
        run: VERSION=${{ steps.meta.outputs.version }} ARCH=${{ matrix.arch }} npm run ${{ matrix.package_script }}

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_name }}-deb-${{ matrix.arch }}
          path: build/${{ matrix.package_name }}_${{ steps.meta.outputs.version }}_${{ matrix.arch }}.deb

  publish-release:
    name: Build and Publish Release Assets
    if: github.event.release.prerelease == false
    needs: build-deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Derive metadata
        id: meta
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Download Debian artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: Flatten Debian artifacts
        run: |
          find build -mindepth 2 -type f -name '*.deb' -exec mv {} build/ \;

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Set release chart version
        run: |
          perl -0pi -e 's/^version: .*/version: $ENV{RELEASE_VERSION}/m' deploy/helm/pod-server/Chart.yaml
          perl -0pi -e 's/^appVersion: .*/appVersion: $ENV{RELEASE_VERSION}/m' deploy/helm/pod-server/Chart.yaml
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}

      - name: Lint chart
        run: helm lint deploy/helm/pod-server --set triplestore.external.url=https://sparql.example.org/query

      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages
          helm package deploy/helm/pod-server \
            --version "${{ steps.meta.outputs.version }}" \
            --app-version "${{ steps.meta.outputs.version }}" \
            --destination .cr-release-packages/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_arm64.deb
            build/oxfordia-pod-idp_${{ steps.meta.outputs.version }}_amd64.deb
            build/oxfordia-pod-idp_${{ steps.meta.outputs.version }}_arm64.deb
            oxfordia-pod-init.sh
            oxfordia-pod-idp-init.sh
            .cr-release-packages/pod-server-${{ steps.meta.outputs.version }}.tgz

      - name: Publish Helm chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
          packages_with_index: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-main-version:
    name: Sync Release Version To Main
    if: github.event.release.prerelease == false
    needs: publish-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync package version
        run: |
          release_version="${RELEASE_TAG#v}"
          npm version "${release_version}" --no-git-tag-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Commit version sync
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: sync release version ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
