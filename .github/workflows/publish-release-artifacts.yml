name: Publish Release Artifacts
 
on:
  push:
    branches:
      - next
    tags:
      - "v*"
 
jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
 
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Derive metadata
        id: meta
        run: |
          echo "owner_lc=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
 
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "image_tags=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pod-server:${GITHUB_REF_NAME#v},ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pod-server:latest" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=${GITHUB_SHA::7}
            echo "version=0.0.0-next.${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "image_tags=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pod-server:next,ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/pod-server:next-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
 
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build server packages
        run: npm run build:server:packages
 
      - name: Build UI server bundle
        run: npm run build:ui
 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
 
      - name: Setup Ruby for fpm
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
 
      - name: Install fpm
        run: gem install --no-document fpm
 
      - name: Build Debian package
        run: VERSION=${{ steps.meta.outputs.version }} npm run build:deb
 
      - name: Setup Helm
        uses: azure/setup-helm@v4
 
      - name: Package Helm chart
        run: |
          helm package deploy/helm/pod-server \
            --version ${{ steps.meta.outputs.version }} \
            --app-version ${{ steps.meta.outputs.version }} \
            --destination build/
 
      - name: Publish GitHub pre-release
        if: steps.meta.outputs.is_prerelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-${{ github.sha }}
          name: "Pre-release next-${GITHUB_SHA::7}"
          prerelease: true
          generate_release_notes: false
          body: |
            Pre-release build from `next` branch.
            Commit: ${{ github.sha }}
 
            **Testing:**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/next-${{ github.sha }}/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            sudo apt install ./oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            ```
          files: |
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            build/pod-server-${{ steps.meta.outputs.version }}.tgz
 
      - name: Publish GitHub release
        if: steps.meta.outputs.is_prerelease == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/oxfordia-pod_${{ steps.meta.outputs.version }}_amd64.deb
            build/pod-server-${{ steps.meta.outputs.version }}.tgz
            oxfordia-pod-init.sh
 
  publish-helm-chart:
    name: Publish Helm Chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup Helm
        uses: azure/setup-helm@v4
 
      - name: Lint chart
        run: helm lint deploy/helm/pod-server --set triplestore.external.url=https://sparql.example.org/query
 
      - name: Publish Helm chart
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy/helm
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 